// ---- Touch controls ----
// These set the same flags the keyboard handler uses, so update()
// doesn't need to know whether input came from a key or a finger.
function bindTouchButton(el, keyName) {
  const press = (e) => { e.preventDefault(); keys[keyName] = true; el.classList.add('active'); };
  const release = (e) => { e.preventDefault(); keys[keyName] = false; el.classList.remove('active'); };
  el.addEventListener('touchstart', press, { passive: false });
  el.addEventListener('touchend', release, { passive: false });
  el.addEventListener('touchcancel', release, { passive: false });
  // Also support mouse for testing on desktop/touch-emulation
  el.addEventListener('mousedown', press);
  el.addEventListener('mouseup', release);
  el.addEventListener('mouseleave', release);
}
bindTouchButton(document.getElementById('leftBtn'), 'ArrowLeft');

const QUESTIONS = [
  { q: "What family of instruments does the Gambus belong to?", options: ["Lute", "Drum", "Flute", "Xylophone"], answer: 0 },
  { q: "The Gambus originates from which musical world?", options: ["Malay world", "Andean world", "Nordic world", "Caribbean world"], answer: 0 },
  { q: "What covers the soundboard of a traditional Gambus Melayu?", options: ["Metal sheet", "Goat skin", "Plastic film", "Glass"], answer: 1 },
  { q: "Which instrument is the Gambus Hadhramaut closely related to?", options: ["Violin", "Oud", "Sitar", "Banjo"], answer: 1 },
  { q: "Gambus music is traditionally performed in which genre?", options: ["Zapin", "Reggae", "Opera", "Techno"], answer: 0 },
  { q: "How is the Gambus typically played?", options: ["Bowed", "Plucked/strummed", "Blown", "Struck with mallets"], answer: 1 },
  { q: "Gambus Melayu is also known by which other name?", options: ["Hijaz", "Tabla", "Kora", "Marimba"], answer: 0 },
];
let lastQIndex = -1;
function pickQuestion() {
  let i;
  do { i = Math.floor(Math.random() * QUESTIONS.length); } while (i === lastQIndex && QUESTIONS.length > 1);
  lastQIndex = i;
  return QUESTIONS[i];
}

function makeLevel() {
  return {
    platforms: [
      {x:0, y:410, w:220, h:40},
      {x:260, y:410, w:140, h:40},
      {x:440, y:340, w:120, h:20},
      {x:600, y:410, w:200, h:40},
      {x:340, y:250, w:110, h:20},
      {x:150, y:190, w:110, h:20},
      {x:0, y:130, w:120, h:20},
      {x:660, y:270, w:140, h:20},
      {x:660, y:130, w:140, h:20},
    ],
    thorns: [
      {x:220, y:392, w:40, h:18},
      {x:400, y:392, w:40, h:18},
      {x:560, y:392, w:40, h:18},
    ],
    strings: [
      {x:290, y:370, r:10, taken:false},
      {x:470, y:300, r:10, taken:false},
      {x:370, y:210, r:10, taken:false},
      {x:180, y:150, r:10, taken:false},
      {x:30, y:90, r:10, taken:false},
      {x:700, y:230, r:10, taken:false},
      {x:700, y:90, r:10, taken:false},
    ],
    flag: {x:770, y:60, w:20, h:70}
  };
}

let level, player, score, lives, gameOver, won, paused, tFrame = 0;

function resetPlayer() {
  player = { x: 20, y: 370, w: 26, h: 34, vx: 0, vy: 0, onGround: false, facing: 1 };
}

function initGame() {
  level = makeLevel();
  score = 0;
  lives = 3;
  gameOver = false;
  won = false;
  paused = false;
  resetPlayer();
  overlay.style.display = 'none';
  quizOverlay.style.display = 'none';
  scoreDisplay.textContent = score;
  livesDisplay.textContent = lives;
}

function restartGame() {
  initGame();
  requestAnimationFrame(loop);
}

function rectsOverlap(a, b) {
  return a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
}

function triggerQuiz() {
  paused = true;
  const q = pickQuestion();
  quizQuestion.textContent = q.q;
  quizOptions.innerHTML = '';
  quizFeedback.textContent = '';
  const letters = ['A', 'B', 'C', 'D'];
  q.options.forEach((opt, idx) => {
    const btn = document.createElement('button');
    btn.className = 'quizBtn';
    btn.textContent = letters[idx] + ') ' + opt;
    btn.onclick = () => answerQuiz(idx, q.answer, btn);
    quizOptions.appendChild(btn);
  });
  quizOverlay.style.display = 'flex';
}

function answerQuiz(chosen, correctIdx, btnEl) {
  const buttons = quizOptions.querySelectorAll('.quizBtn');
  buttons.forEach(b => b.onclick = null);
  if (chosen === correctIdx) {
    btnEl.classList.add('correct');
    quizFeedback.textContent = "✅ Correct! You keep your life.";
  } else {
    btnEl.classList.add('wrong');
    buttons[correctIdx].classList.add('correct');
    quizFeedback.textContent = "❌ Not quite — losing a life.";
    lives--;
    livesDisplay.textContent = lives;
  }
  setTimeout(() => {
    quizOverlay.style.display = 'none';
    if (lives <= 0) {
      gameOver = true;
      showOverlay('💔 Out of Lives', 'The strings scattered... but every musician starts somewhere. Try again!');
    } else {
      resetPlayer();
      paused = false;
      requestAnimationFrame(loop);
    }
  }, 1400);
}

function loseLife() {
  paused = true;
  triggerQuiz();
}

function showOverlay(title, text) {
  overlayTitle.textContent = title;
  overlayText.textContent = text;
  overlay.style.display = 'flex';
}

function update() {
  if (gameOver || paused) return;

  if (keys['ArrowLeft'] || keys['a'] || keys['A']) { player.vx = -4; player.facing = -1; }
  else if (keys['ArrowRight'] || keys['d'] || keys['D']) { player.vx = 4; player.facing = 1; }
  else { player.vx = 0; }

  if ((keys[' '] || keys['w'] || keys['W'] || keys['ArrowUp']) && player.onGround) {
    player.vy = -12.5;
    player.onGround = false;
  }

  player.vy += GRAVITY;
  player.x += player.vx;
  player.y += player.vy;

  if (player.x < 0) player.x = 0;
  if (player.x + player.w > W) player.x = W - player.w;
  if (player.y > H) { loseLife(); return; }

  player.onGround = false;
  for (const p of level.platforms) {
    if (player.x + player.w > p.x && player.x < p.x + p.w) {
      const feetY = player.y + player.h;
      if (player.vy >= 0 && feetY >= p.y && feetY <= p.y + p.h + 12 && player.y < p.y) {
        player.y = p.y - player.h;
        player.vy = 0;
        player.onGround = true;
      }
    }
  }

  for (const t of level.thorns) {
    if (rectsOverlap(player, t)) { loseLife(); return; }
  }

  for (const s of level.strings) {
    if (s.taken) continue;
    const dx = (player.x + player.w/2) - s.x;
    const dy = (player.y + player.h/2) - s.y;
    if (Math.sqrt(dx*dx + dy*dy) < s.r + 18) {
      s.taken = true;
      score++;
      scoreDisplay.textContent = score;
    }
  }

  if (score >= 7 && rectsOverlap(player, level.flag)) {
    won = true;
    gameOver = true;
    showOverlay('🎉 You Built Your Gambus!', 'You collected all 7 strings and completed the instrument. Well played, Gambus master!');
  }
}

function drawSky() {
  const g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, '#2e4a63');
  g.addColorStop(0.55, '#5b83a0');
  g.addColorStop(1, '#a9c9a0');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, H);

  const sun = ctx.createRadialGradient(660, 80, 5, 660, 80, 90);
  sun.addColorStop(0, 'rgba(255,230,160,0.9)');
  sun.addColorStop(1, 'rgba(255,230,160,0)');
  ctx.fillStyle = sun;
  ctx.fillRect(560, 0, 220, 200);

  ctx.fillStyle = 'rgba(255,255,255,0.15)';
  for (let i = 0; i < 40; i++) {
    const x = (i * 137) % W;
    const y = (i * 59) % 160;
    ctx.fillRect(x, y, 2, 2);
  }

  ctx.fillStyle = '#3f5f52';
  ctx.beginPath();
  ctx.moveTo(0, 260); ctx.lineTo(120, 180); ctx.lineTo(260, 260);
  ctx.lineTo(420, 190); ctx.lineTo(560, 260); ctx.lineTo(720, 200);
  ctx.lineTo(800, 260); ctx.lineTo(800, 460); ctx.lineTo(0, 460);
  ctx.closePath();
  ctx.fill();

  ctx.fillStyle = '#7fa06e';
  ctx.beginPath();
  ctx.ellipse(150, 470, 240, 100, 0, 0, Math.PI*2);
  ctx.ellipse(620, 480, 280, 110, 0, 0, Math.PI*2);
  ctx.fill();

  ctx.fillStyle = 'rgba(60,90,50,0.35)';
  for (let i = 0; i < 160; i++) {
    const x = (i * 47) % W;
    const y = 400 + ((i * 23) % 50);
    ctx.fillRect(x, y, 2, 5);
  }
}

function drawPlatform(p) {
  const g = ctx.createLinearGradient(p.x, p.y, p.x, p.y + p.h);
  g.addColorStop(0, '#9a6a3a');
  g.addColorStop(1, '#5c3a1e');
  ctx.fillStyle = g;
  ctx.fillRect(p.x, p.y, p.w, p.h);

  ctx.fillStyle = '#c99a5c';
  ctx.fillRect(p.x, p.y, p.w, 4);

  ctx.strokeStyle = 'rgba(0,0,0,0.25)';
  ctx.lineWidth = 1;
  const plankW = 26;
  for (let x = p.x; x < p.x + p.w; x += plankW) {
    ctx.beginPath();
    ctx.moveTo(x, p.y + 4);
    ctx.lineTo(x, p.y + p.h);
    ctx.stroke();
  }
  ctx.strokeStyle = 'rgba(0,0,0,0.15)';
  for (let yy = p.y + 8; yy < p.y + p.h; yy += 6) {
    ctx.beginPath();
    ctx.moveTo(p.x + 2, yy);
    ctx.lineTo(p.x + p.w - 2, yy + (Math.sin(yy) * 2));
    ctx.stroke();
  }
  ctx.fillStyle = 'rgba(40,20,5,0.4)';
  for (let x = p.x + 14; x < p.x + p.w; x += 50) {
    ctx.beginPath();
    ctx.ellipse(x, p.y + p.h/2, 3, 5, 0, 0, Math.PI*2);
    ctx.fill();
  }
}

function drawThorn(t) {
  for (let i = 0; i < t.w; i += 9) {
    const g = ctx.createLinearGradient(t.x+i, t.y, t.x+i, t.y+t.h);
    g.addColorStop(0, '#e74c3c');
    g.addColorStop(1, '#7a1e12');
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.moveTo(t.x + i, t.y + t.h);
    ctx.lineTo(t.x + i + 4.5, t.y);
    ctx.lineTo(t.x + i + 9, t.y + t.h);
    ctx.fill();
  }
}

function drawString(s, t) {
  const pulse = 1 + Math.sin(t/10 + s.x) * 0.12;
  const glow = ctx.createRadialGradient(s.x, s.y, 1, s.x, s.y, s.r * 2.2 * pulse);
  glow.addColorStop(0, 'rgba(242,201,76,0.9)');
  glow.addColorStop(1, 'rgba(242,201,76,0)');
  ctx.fillStyle = glow;
  ctx.beginPath();
  ctx.arc(s.x, s.y, s.r * 2.2 * pulse, 0, Math.PI*2);
  ctx.fill();

  ctx.fillStyle = '#f2c94c';
  ctx.beginPath();
  ctx.arc(s.x, s.y, s.r * pulse, 0, Math.PI*2);
  ctx.fill();
  ctx.fillStyle = '#7a5a10';
  ctx.font = 'bold 14px Georgia';
  ctx.textAlign = 'center';
  ctx.fillText('♪', s.x, s.y+5);
}

function drawPlayer() {
  ctx.save();
  ctx.translate(player.x + player.w/2, player.y + player.h/2);
  ctx.scale(player.facing, 1);

  ctx.fillStyle = 'rgba(0,0,0,0.25)';
  ctx.beginPath();
  ctx.ellipse(0, 20, 14, 4, 0, 0, Math.PI*2);
  ctx.fill();

  ctx.fillStyle = '#5c3a1e';
  ctx.beginPath();
  ctx.ellipse(11, 1, 8, 6, 0.4, 0, Math.PI*2);
  ctx.fill();
  ctx.strokeStyle = '#e0c48a';
  ctx.lineWidth = 0.7;
  for (let i=-4;i<=4;i+=2){ ctx.beginPath(); ctx.moveTo(11+i,-4); ctx.lineTo(11+i,7); ctx.stroke(); }

  ctx.fillStyle = '#3a2a1a';
  ctx.fillRect(-7, 8, 6, 10);
  ctx.fillRect(2, 8, 6, 10);

  const bodyG = ctx.createLinearGradient(-10,-5,10,15);
  bodyG.addColorStop(0, '#6a4a9a');
  bodyG.addColorStop(1, '#4a2f6e');
  ctx.fillStyle = bodyG;
  ctx.fillRect(-10, -5, 20, 18);
  ctx.strokeStyle = '#e0b25c';
  ctx.lineWidth = 1.5;
  ctx.strokeRect(-10, -5, 20, 18);

  ctx.fillStyle = '#e8c49a';
  ctx.beginPath();
  ctx.ellipse(0, -13, 8, 7, 0, 0, Math.PI*2);
  ctx.fill();

  ctx.fillStyle = '#c0392b';
  ctx.beginPath();
  ctx.ellipse(0, -18, 9, 5, 0, Math.PI, Math.PI*2);
  ctx.fill();

  ctx.restore();
}

function drawFlag() {
  const f = level.flag;
  ctx.fillStyle = '#5c3a1e';
  ctx.fillRect(f.x, f.y, 4, f.h);
  ctx.fillStyle = score >= 7 ? '#f2c94c' : '#8a8a8a';
  ctx.beginPath();
  ctx.moveTo(f.x+4, f.y);
  ctx.lineTo(f.x+26, f.y+11);
  ctx.lineTo(f.x+4, f.y+22);
  ctx.fill();
}

function draw() {
  tFrame++;
  drawSky();
  for (const p of level.platforms) drawPlatform(p);
  for (const t of level.thorns) drawThorn(t);
  for (const s of level.strings) if (!s.taken) drawString(s, tFrame);
  drawFlag();
  drawPlayer();

  if (!gameOver && !paused) {
    requestAnimationFrame(loop);
  }
}

function loop() {
  update();
  draw();
}

initGame();
requestAnimationFrame(loop);
</script>
